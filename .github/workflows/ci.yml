# Runs every package's documented checks (docs/DEVELOPMENT.md), then the opt-in
# Docker integration tests on a disposable runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/state-store
            module: failroom_state
          - package: services/api
            module: failroom_api
          - package: services/sandbox-engine
            module: failroom_sandbox
          - package: services/control-plane
            module: failroom_control_plane
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          checksum: "4ae93e0f148a18434cc094072547cec88912fc4a72b984183c7d0d0e9586cb5e"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy ${{ matrix.module }}

  linux-docker:
    name: linux-docker
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          checksum: "4ae93e0f148a18434cc094072547cec88912fc4a72b984183c7d0d0e9586cb5e"
          enable-cache: true
          cache-dependency-glob: |
            services/sandbox-engine/uv.lock
            services/control-plane/uv.lock
      - run: bash .github/scripts/linux-docker-integration.sh
